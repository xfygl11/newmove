name: newmove
description: "AI 写小说 + 小说改动漫全流程手机 App（Android 本地端）。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  flutter_quill: ^11.6.0
  cached_network_image: ^4.0.4
  video_player: ^2.14.1
  path_provider: ^2.1.6
  go_router: ^18.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.1

flutter:
  uses-material-design: true
  assets:
    - assets/skills/
    - assets/skills/novel/
    - assets/skills/adaptation/
    - assets/skills/skeleton/
